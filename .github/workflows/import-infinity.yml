name: Import InfinityX coral kernel for RisingOS
on:
  push:
    paths:
      - .github/workflows/import-infinity.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'its-hecker/risingos-coral-kernel'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import latest known-working InfinityX kernel
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --single-branch --depth 1 --branch cnb-Latest-stable https://github.com/its-hecker/infinity_cnb_kernel_google_msm-4.14.git /tmp/infinity-source
          rsync -a --delete --exclude='/.git/' --exclude='/.github/' /tmp/infinity-source/ ./
          git config user.name Hecker
          git config user.email 118846180+its-hecker@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'rising: import stable InfinityX coral kernel'
            git push origin HEAD:main
          fi
